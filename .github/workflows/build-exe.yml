name: Build EXE

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка PyInstaller
        run: pip install pyinstaller

      - name: Сборка EXE
        run: pyinstaller --onefile --windowed --name TerminalControl terminal_control.py
        working-directory: pc-control

      - uses: actions/upload-artifact@v4
        with:
          name: TerminalControl-exe
          path: pc-control/dist/TerminalControl.exe
