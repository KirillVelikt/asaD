name: Build EXE + Installer
on: push

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name TerminalControl pc-control/terminal_control.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\terminal_installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: TerminalControl-EXE
          path: dist/TerminalControl.exe
      - uses: actions/upload-artifact@v4
        with:
          name: TerminalControl-Installer
          path: installer/Output/TerminalControlSetup.exe
